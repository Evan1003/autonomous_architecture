[project]
name = "archflow-mcp"
version = "0.1.0"
description = "Architecture-first AI collaboration workflow as an MCP server"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.0",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
archflow = "archflow.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/archflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
